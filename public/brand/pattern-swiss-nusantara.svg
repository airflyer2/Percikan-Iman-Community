<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="pattern-title">
  <title id="pattern-title">Swiss-Nusantara v2 Geometric Pattern Tile (Greige, Cobalt &amp; Teak)</title>
  <rect width="240" height="240" fill="#EAE6DF"/>

  <!-- Architectural 60px Swiss hairline grid -->
  <g stroke="#D5CFC4" stroke-width="0.85">
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="0" y1="60" x2="240" y2="60"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="180" x2="240" y2="180"/>
  </g>

  <!-- Subtle Alpine topographic contour arcs wrapping tile boundaries -->
  <g fill="none" stroke="#5B7E9E" stroke-opacity="0.22" stroke-width="1">
    <path d="M 0 36 C 60 12, 180 60, 240 36"/>
    <path d="M 0 156 C 60 132, 180 180, 240 156"/>
    <path d="M 36 0 C 12 60, 60 180, 36 240"/>
    <path d="M 156 0 C 132 60, 180 180, 156 240"/>
  </g>

  <!-- Center Nusantara Kawung & Faceted Diamond Star at (120, 120) -->
  <g transform="translate(120 120)">
    <polygon points="0,-46 14,-14 46,0 14,14 0,46 -14,14 -46,0 -14,-14" fill="#1D5B8C" fill-opacity="0.07" stroke="#1D5B8C" stroke-opacity="0.26" stroke-width="1"/>
    <polygon points="0,-24 9,-9 24,0 9,9 0,24 -9,9 -24,0 -9,-9" fill="#5B7E9E" fill-opacity="0.11" stroke="#5B7E9E" stroke-opacity="0.30" stroke-width="0.9"/>
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#8C5327" fill-opacity="0.22" stroke="#8C5327" stroke-opacity="0.48" stroke-width="0.9"/>
    <circle cx="0" cy="-32" r="2.2" fill="#8C5327" fill-opacity="0.45"/>
    <circle cx="32" cy="0" r="2.2" fill="#8C5327" fill-opacity="0.45"/>
    <circle cx="0" cy="32" r="2.2" fill="#8C5327" fill-opacity="0.45"/>
    <circle cx="-32" cy="0" r="2.2" fill="#8C5327" fill-opacity="0.45"/>
  </g>

  <!-- Seamless corner Kawung/Diamond quarters (0,0), (240,0), (0,240), (240,240) -->
  <g fill="#1D5B8C" fill-opacity="0.07" stroke="#1D5B8C" stroke-opacity="0.24" stroke-width="1">
    <path d="M 0 0 L 46 0 L 14 14 L 0 46 Z"/>
    <path d="M 240 0 L 240 46 L 226 14 L 194 0 Z"/>
    <path d="M 0 240 L 0 194 L 14 226 L 46 240 Z"/>
    <path d="M 240 240 L 194 240 L 226 226 L 240 194 Z"/>
  </g>
  <g fill="#8C5327" fill-opacity="0.12" stroke="#8C5327" stroke-opacity="0.32" stroke-width="0.9">
    <path d="M 0 0 L 20 0 L 7 7 L 0 20 Z"/>
    <path d="M 240 0 L 240 20 L 233 7 L 220 0 Z"/>
    <path d="M 0 240 L 0 220 L 7 233 L 20 240 Z"/>
    <path d="M 240 240 L 220 240 L 233 233 L 240 220 Z"/>
  </g>

  <!-- Swiss "+" registration crosshairs at secondary grid nodes -->
  <g stroke="#1D5B8C" stroke-opacity="0.38" stroke-width="1.2" stroke-linecap="square">
    <line x1="55" y1="60" x2="65" y2="60"/><line x1="60" y1="55" x2="60" y2="65"/>
    <line x1="175" y1="60" x2="185" y2="60"/><line x1="180" y1="55" x2="180" y2="65"/>
    <line x1="55" y1="180" x2="65" y2="180"/><line x1="60" y1="175" x2="60" y2="185"/>
    <line x1="175" y1="180" x2="185" y2="180"/><line x1="180" y1="175" x2="180" y2="185"/>
  </g>
</svg>
