<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="72" viewBox="0 0 280 72" role="img" aria-labelledby="motif-signpost-title">
  <title id="motif-signpost-title">Anatomy of the Spark — Roasted Teak Wegweiser Signpost Badge</title>
  <!-- Outer Swiss frame -->
  <rect x="2" y="2" width="276" height="68" rx="10" fill="#F4F2ED" stroke="#D5CFC4" stroke-width="1.5"/>
  <!-- Left Roasted Teak directional marker block -->
  <path d="M 10 10 L 60 10 L 72 36 L 60 62 L 10 62 Z" fill="#8C5327"/>
  <!-- Inner 45-degree directional Spark chevron -->
  <polygon points="29,24 41,36 29,48 36,48 48,36 36,24" fill="#FAF9F6"/>
  <!-- Right coordinate plate -->
  <rect x="82" y="14" width="184" height="44" rx="6" fill="#FAF9F6" stroke="#D5CFC4" stroke-width="1"/>
  <!-- Geometric signpost bars representing Wegweiser route & metadata -->
  <rect x="94" y="24" width="104" height="7" rx="3.5" fill="#132435"/>
  <rect x="94" y="39" width="68" height="5" rx="2.5" fill="#5B7E9E"/>
  <!-- Top-right Swiss registration dot + diamond accent -->
  <polygon points="246,30 252,36 246,42 240,36" fill="#1D5B8C"/>
  <circle cx="222" cy="36" r="3" fill="#8C5327"/>
</svg>
